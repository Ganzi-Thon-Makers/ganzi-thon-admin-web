name: '기능 개발'
description: '새로운 기능 구현 작업을 정의합니다.'
title: '[feat] '
labels: ['feat']
body:
  - type: textarea
    id: objective
    attributes:
      label: '구현할 기능 설명'
      description: '구현하고자 하는 기능의 목표와 내용을 간결하게 작성해주세요.'
      placeholder: '예: 부스 관리자 목록 조회 및 검색 기능 구현'
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: '세부 작업 목록 (To-Do)'
      description: '기능 완성을 위한 세부 작업을 체크리스트로 작성해주세요.'
      placeholder: |
        - [ ] UI 컴포넌트 구현
        - [ ] API 연동 및 상태 관리
        - [ ] 예외 처리 및 동작 검증
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: '참고 사항 / 완료 조건 (선택)'
      description: '참고할 디자인 링크, 기술적 제약, 완료 조건 등을 자유롭게 작성해주세요.'
    validations:
      required: false
