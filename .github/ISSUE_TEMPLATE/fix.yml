name: '버그 수정'
description: '발생한 버그와 문제 해결 작업을 정의합니다.'
title: '[fix] '
labels: ['fix']
body:
  - type: textarea
    id: summary
    attributes:
      label: '버그 요약 및 재현 방법'
      description: '어떤 문제가 발생하며 어떻게 재현되는지 간결하게 작성해주세요.'
      placeholder: |
        - 증상:
        - 재현 절차:
        - 기대 동작:
        - 실제 동작:
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: '수정 작업 목록 (To-Do)'
      description: '문제 해결을 위한 세부 작업을 체크리스트로 작성해주세요.'
      placeholder: |
        - [ ] 원인 분석 및 재현 확인
        - [ ] 코드 수정
        - [ ] 수정 결과 검증
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: '추가 정보 (선택)'
      description: '관련 로그, 스크린샷, 영향 범위 등을 작성해주세요.'
    validations:
      required: false
